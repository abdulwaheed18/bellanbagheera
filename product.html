<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Bella Nawaab Bagheera</title>
    <meta name="description" content="Discover curated toys, treats, and treasures personally tested by Bella, Nawaab & Bagheera.">
    <link rel="stylesheet" href="style.css">

    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
    
    <!-- Google tag (gtag.js) - Placeholder for GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-XXXXXXXXXX');
    </script>
    
    <style>
        .product-detail-container {
            padding: 8rem 1rem 4rem;
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .product-detail-container {
                grid-template-columns: 1fr 1fr;
                gap: 4rem;
            }
        }

        .product-image-col {
            position: relative;
        }

        .product-image {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid rgba(212,175,55,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .product-info-col {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .product-title {
            color: var(--color-primary);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .product-price {
            font-size: 1.5rem;
            color: #fff;
            font-weight: bold;
        }

        .cat-endorsement {
            background: #111;
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid var(--color-primary);
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .cat-endorsement-icon {
            font-size: 2rem;
            line-height: 1;
        }

        .cat-endorsement-text h4 {
            color: var(--color-primary);
            margin-bottom: 0.5rem;
        }

        .cat-endorsement-text p {
            color: var(--color-text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .product-description {
            color: var(--color-text);
            line-height: 1.8;
            font-size: 1.1rem;
        }

        .btn-buy-large {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text-muted);
            text-decoration: none;
            margin-bottom: 2rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--color-primary);
        }

        .loading-state, .error-state {
            text-align: center;
            padding: 8rem 1rem;
            color: var(--color-text-muted);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Global Sticky Navigation -->
    <header class="header" style="position: fixed; top: 0; width: 100%; z-index: 1000; background: rgba(5,5,5,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1);">
        <div class="container" style="display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; flex-wrap: wrap;">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <button class="hamburger-menu" aria-label="Menu" onclick="document.getElementById('mobile-nav').classList.toggle('active')" style="background: none; border: none; color: white; cursor: pointer; display: none;">
                    <i data-feather="menu"></i>
                </button>
                <a href="index.html" class="logo" style="font-size: 1.5rem; color: #fff; font-weight: bold; text-decoration: none;">BNB</a>
            </div>
            <nav class="desktop-nav" style="display: flex; gap: 1.5rem; align-items: center;">
                <a href="index.html" style="color: #fff; text-decoration: none; font-size: 0.9rem; text-transform: uppercase;">Home</a>
                <a href="index.html#product-grid" style="color: var(--color-primary); text-decoration: none; font-size: 0.9rem; text-transform: uppercase;">Shop</a>
                <a href="about.html" style="color: #fff; text-decoration: none; font-size: 0.9rem; text-transform: uppercase;">Our Story</a>
                <a href="index.html#games-section" style="color: #fff; text-decoration: none; font-size: 0.9rem; text-transform: uppercase;">Royal Games</a>
                <a href="contact.html" style="color: #fff; text-decoration: none; font-size: 0.9rem; text-transform: uppercase;">Contact</a>
            </nav>
        </div>
        <!-- Mobile Nav Menu -->
        <div id="mobile-nav" class="mobile-nav" style="display: none; flex-direction: column; background: #050505; padding: 1rem; width: 100%;">
            <a href="index.html" style="padding: 0.5rem; text-transform: uppercase; display: block; color: white; text-decoration: none;">Home</a>
            <a href="index.html#product-grid" style="padding: 0.5rem; text-transform: uppercase; display: block; color: var(--color-primary); text-decoration: none;">Shop</a>
            <a href="about.html" style="padding: 0.5rem; text-transform: uppercase; display: block; color: white; text-decoration: none;">Our Story</a>
            <a href="index.html#games-section" style="padding: 0.5rem; text-transform: uppercase; display: block; color: white; text-decoration: none;">Royal Games</a>
            <a href="contact.html" style="padding: 0.5rem; text-transform: uppercase; display: block; color: white; text-decoration: none;">Contact</a>
        </div>
        <style>
            @media (max-width: 900px) {
                .desktop-nav { display: none !important; }
                .hamburger-menu { display: block !important; }
                #mobile-nav.active { display: flex !important; margin-top: 1rem; }
            }
        </style>
    </header>

    <main id="main-content">
        <div id="loading" class="loading-state">
            <h2 style="color: var(--color-primary);">Loading Royal Treasure...</h2>
            <div class="skeleton-img shimmer" style="width: 100px; height: 100px; border-radius: 50%; margin: 2rem auto;"></div>
        </div>

        <div id="error" class="error-state hidden">
            <i data-feather="alert-circle" style="width: 64px; height: 64px; margin-bottom: 2rem; color: var(--color-primary);"></i>
            <h2>Treasure Not Found</h2>
            <p style="margin-bottom: 2rem;">The royal archives could not locate this item.</p>
            <a href="index.html" class="btn btn-outline">Return to Kingdom</a>
        </div>

        <div id="product-detail" class="container product-detail-container hidden">
            <!-- Rendered via JS -->
        </div>

        <div id="recently-viewed" class="container hidden" style="margin-top: 4rem; padding: 2rem 1rem;">
            <h3 style="color: var(--color-primary); margin-bottom: 1.5rem; text-align: center; font-size: 1.8rem;">Recently Admired</h3>
            <div id="recent-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem;">
                <!-- JS populated -->
            </div>
        </div>
    </main>

    <footer class="footer-minimal">
        <div class="container" style="text-align: center; padding: 2rem 0; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 4rem;">
            <p class="footer-copy" style="color: #666; font-size: 0.8rem;">© 2026 Bella Nawaab Bagheera. Designed for Royalty.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/csv-parser.js"></script>
    <script src="js/notes-formatter.js"></script>
    <script>
        feather.replace();

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productTitle = urlParams.get('title');

            if (!productTitle) {
                showError();
                return;
            }

            try {
                // Fetch Data
                const res = await fetch(config.googleSheetUrl);
                if (!res.ok) throw new Error("Network error");
                const text = await res.text();
                
                const parsedProducts = parseCSV(text);
                const allProducts = parsedProducts.map(product => ({
                    ...product,
                    price: product.price ? parseFloat(String(product.price).replace(/[^0-9.-]+/g, "")) : 0,
                    category: product.category ? product.category.split(',').map(c => c.trim()).filter(Boolean) : []
                }));

                // Find specific product
                const product = allProducts.find(p => p.title === productTitle);

                if (!product) {
                    showError();
                    return;
                }

                renderProduct(product);

            } catch (err) {
                console.error("Failed to load product", err);
                showError();
            }
        });

        function showError() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('product-detail').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
        }

        // Security: Validate URLs — only allow http/https
        function sanitizeURL(url) {
            if (!url || typeof url !== 'string') return '#';
            const trimmed = url.trim();
            if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) {
                return trimmed;
            }
            return '#';
        }

        // Security: Escape HTML to prevent XSS from Google Sheet data
        function escapeHTML(str) {
            if (!str || typeof str !== 'string') return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function renderProduct(product) {
            const container = document.getElementById('product-detail');
            document.getElementById('loading').classList.add('hidden');
            
            // Endorsement logic
            let endorsementHtml = '';
            if (product.recommendation) {
                const rec = product.recommendation.toLowerCase().trim();
                if (rec === 'recommended') {
                    endorsementHtml = `
                        <div class="cat-endorsement">
                            <div class="cat-endorsement-icon">🐾</div>
                            <div class="cat-endorsement-text">
                                <h4>Bella Approved</h4>
                                <p>This treasury meets the highest standards of the royal feline court.</p>
                            </div>
                        </div>`;
                } else if (rec === 'ok') {
                    endorsementHtml = `
                        <div class="cat-endorsement">
                            <div class="cat-endorsement-icon">✨</div>
                            <div class="cat-endorsement-text">
                                <h4>Bagheera's Pick</h4>
                                <p>Durable enough for the toughest of hunters. Highly enjoyable.</p>
                            </div>
                        </div>`;
                } else if (rec === 'avoid') {
                    endorsementHtml = `
                        <div class="cat-endorsement">
                            <div class="cat-endorsement-icon">😾</div>
                            <div class="cat-endorsement-text">
                                <h4>Nawaab Says No</h4>
                                <p>Not up to our royal standards. Spend your gold elsewhere.</p>
                            </div>
                        </div>`;
                }
            }

            // Categories
            const categoriesHtml = product.category 
                ? product.category.map(c => `<span style="background: rgba(212,175,55,0.1); color: var(--color-primary); padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; text-transform: uppercase;">${escapeHTML(c)}</span>`).join(' ')
                : '';

            container.innerHTML = `
                <div class="product-image-col">
                    <a href="index.html" class="back-link"><i data-feather="arrow-left"></i> Back to Shop</a>
                    <img src="${sanitizeURL(product.image)}" alt="${escapeHTML(product.title)}" class="product-image">
                </div>
                <div class="product-info-col">
                    <div>
                        <div style="margin-bottom: 1rem;">${categoriesHtml}</div>
                        <h1 class="product-title">${escapeHTML(product.title)}</h1>
                        <p class="product-price">₹${product.price.toFixed(2)}</p>
                    </div>

                    ${endorsementHtml}

                    <div class="product-description format-notes">
                        ${formatNotesContent(escapeHTML(product.notes || 'No description provided by the royal court.'))}
                    </div>

                    <a href="${sanitizeURL(product.url)}" target="_blank" class="btn btn-primary btn-buy-large">
                        Buy Now <i data-feather="external-link"></i>
                    </a>
                </div>
            `;

            container.classList.remove('hidden');
            feather.replace();
            
            // Set Page Title
            document.title = `${escapeHTML(product.title)} | Bella Nawaab Bagheera`;

            // Schema Markup (SEO)
            const schema = {
                "@context": "https://schema.org/",
                "@type": "Product",
                "name": product.title,
                "image": [ sanitizeURL(product.image) ],
                "description": product.notes || "A royal treasury item.",
                "offers": {
                    "@type": "Offer",
                    "url": sanitizeURL(product.url),
                    "priceCurrency": "INR",
                    "price": product.price,
                    "availability": "https://schema.org/InStock",
                    "seller": {
                        "@type": "Organization",
                        "name": "Bella Nawaab Bagheera"
                    }
                }
            };
            const script = document.createElement('script');
            script.type = 'application/ld+json';
            script.textContent = JSON.stringify(schema);
            document.head.appendChild(script);

            // Fetch and inject affiliate disclosure from config
            if (config && config.affiliateDisclosure) {
                const footerContainer = document.querySelector('.footer-minimal .container');
                if (footerContainer) {
                    const disclosure = document.createElement('p');
                    disclosure.className = "affiliate-disclosure";
                    disclosure.style.cssText = "margin-bottom: 1rem; color: #888; font-size: 0.85rem;";
                    disclosure.textContent = config.affiliateDisclosure;
                    footerContainer.insertBefore(disclosure, footerContainer.firstChild);
                }
            }

            // Update Recently Viewed
            updateRecentlyViewed(product);
        }

        function updateRecentlyViewed(product) {
            let recent = JSON.parse(localStorage.getItem('bnb_recent') || '[]');
            
            // Render existing first before adding current (so current is excluded from view)
            const recentGrid = document.getElementById('recent-grid');
            const toShow = recent.filter(p => p.title !== product.title).slice(0, 4);
            
            if (toShow.length > 0) {
                document.getElementById('recently-viewed').classList.remove('hidden');
                recentGrid.innerHTML = toShow.map(p => `
                    <a href="product.html?title=${encodeURIComponent(p.title)}" style="text-decoration: none; display: block; background: #111; border: 1px solid rgba(212,175,55,0.1); border-radius: 8px; overflow: hidden; transition: transform 0.2s;">
                        <img src="${sanitizeURL(p.image)}" style="width: 100%; height: 200px; object-fit: cover;" alt="${escapeHTML(p.title)}">
                        <div style="padding: 1rem; text-align: center;">
                            <h4 style="color: #fff; font-size: 0.95rem; margin-bottom: 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHTML(p.title)}</h4>
                            <p style="color: var(--color-primary); font-weight: bold; font-size:0.9rem;">₹${parseFloat(p.price).toFixed(2)}</p>
                        </div>
                    </a>
                `).join('');
            }

            // Now update storage with current item
            recent = recent.filter(p => p.title !== product.title);
            recent.unshift({ title: product.title, image: product.image, price: product.price });
            localStorage.setItem('bnb_recent', JSON.stringify(recent.slice(0, 5))); // Keep 5 to show 4
        }
    </script>
</body>
</html>
