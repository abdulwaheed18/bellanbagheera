<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BNB Fly-Zapper V2 🐾 | Bella Nawaab Bagheera</title>
    <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
    <meta name="description" content="Play the Fly-Zapper game on Bella Nawaab Bagheera! High-speed reflexes and bug splats tailored for Bagheera and your feline friends.">
    <meta property="og:title" content="BNB Fly-Zapper V2 🐾 | Bella Nawaab Bagheera">
    <meta property="og:description" content="Play the Fly-Zapper game on Bella Nawaab Bagheera! High-speed reflexes and bug splats tailored for Bagheera and your feline friends.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="images/profile_avatar.png">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #121212;
            user-select: none;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        #exit-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            z-index: 100;
        }

        .tutorial {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.2);
            font-family: sans-serif;
            font-weight: bold;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: fadeOut 3s forwards 2s;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
            }
        }
        .back-to-shop {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.6);
            color: #D4AF37;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid #D4AF37;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .back-to-shop:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>
    <!-- Global Nav -->
    <header style="position: absolute; top: 0; left: 0; width: 100%; padding: 1rem; display: flex; justify-content: space-between; align-items: center; z-index: 2000; pointer-events: none; box-sizing: border-box;">
        <a href="index.html" style="font-size: 1.5rem; color: #fff; font-weight: bold; text-decoration: none; font-family: sans-serif; pointer-events: auto;">BNB</a>
        <div style="display: flex; gap: 1rem; align-items: center; pointer-events: auto;">
            <a href="index.html#product-grid" style="color: #000; background: #D4AF37; text-decoration: none; font-size: 0.9rem; text-transform: uppercase; font-family: sans-serif; font-weight: bold; padding: 0.5rem 1rem; border-radius: 4px;">Shop Now</a>
            <button style="background: none; border: none; color: white; cursor: pointer;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>
    </header>
    <a href="index.html" class="back-to-shop">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Shop
    </a>
    <div class="tutorial">Tap to Catch</div>
    <div id="exit-zone"></div>
    <canvas id="gameCanvas"></canvas>

    <script src="js/exit-handler.js"></script>
    <script type="module">
        import { GameEngine, Draw, randomRange } from './game-utils.js';

        class FlyGame extends GameEngine {
            constructor() {
                super('gameCanvas');

                this.fly = {
                    x: this.width / 2, y: this.height / 2,
                    radius: 50,
                    vx: 0, vy: 0,
                    state: 'normal', // normal, freeze, dash
                    timer: 0,
                    angle: 0
                };

                this.particles = [];
                this.shake = 0;
                this.score = 0;

                this.start((dt) => this.update(dt), (ctx) => this.draw(ctx));
            }


            update(dt) {
                // Screen Shake Decay
                if (this.shake > 0) this.shake -= dt * 30;
                if (this.shake < 0) this.shake = 0;

                this.updateFly(dt);
                this.updateInput();
                this.updateParticles(dt);
            }

            updateInput() {
                // Check simple hit (circle vs point)
                if (this.input.justPressed) {
                    const dist = Math.hypot(this.input.x - this.fly.x, this.input.y - this.fly.y);
                    // Generous hitbox (+50px)
                    if (dist < this.fly.radius + 50) {
                        this.onCatch();
                    }
                }
            }

            onCatch() {
                this.score++;
                this.shake = 20; // SCREEEN SHAKEEE
                this.audio.playPop(); // POP sound

                // Show Score Update Toast
                if (typeof UI !== 'undefined' && UI.showToast) {
                    UI.showToast(`Score: ${this.score}! 🐾`);
                }

                // Dynamic Share Button Logic
                let shareBtn = document.getElementById('insta-share-btn');
                if (!shareBtn) {
                    shareBtn = document.createElement('button');
                    shareBtn.id = 'insta-share-btn';
                    shareBtn.innerHTML = '📷 Share Score to Instagram';
                    shareBtn.style.cssText = `
                        position: absolute;
                        bottom: 20px;
                        left: 50%;
                        transform: translateX(-50%);
                        z-index: 1000;
                        background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
                        color: white;
                        padding: 12px 24px;
                        border: none;
                        border-radius: 20px;
                        font-family: sans-serif;
                        font-weight: bold;
                        font-size: 16px;
                        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
                        cursor: pointer;
                        transition: transform 0.2s;
                    `;
                    
                    shareBtn.onmousedown = (e) => e.stopPropagation();
                    shareBtn.ontouchstart = (e) => e.stopPropagation();

                    shareBtn.onclick = async () => {
                        const text = `My cat just swatted ${this.score} bugs on The Fly-Zapper at Bella Nawaab Bagheera! 🐾 Can your cat beat this? Play at bellanbagheera.com/bughunt.html @bella_and_bagheera`;
                        if (navigator.share) {
                            try {
                                await navigator.share({
                                    title: 'BNB Fly-Zapper Score',
                                    text: text,
                                    url: 'https://bellanbagheera.com/bughunt.html'
                                });
                            } catch (err) {
                                console.log("Error sharing", err);
                            }
                        } else {
                            navigator.clipboard.writeText(text);
                            if (typeof UI !== 'undefined' && UI.showToast) {
                                UI.showToast("Score copied to clipboard for Instagram!");
                            } else {
                                alert("Score copied to clipboard for Instagram!");
                            }
                        }
                    };
                    
                    document.body.appendChild(shareBtn);
                } else {
                     // Flash effect to draw attention
                     shareBtn.style.transform = 'translateX(-50%) scale(1.1)';
                     setTimeout(() => shareBtn.style.transform = 'translateX(-50%) scale(1)', 200);
                }

                // Spawn Particles (Juice)
                for (let i = 0; i < 15; i++) {
                    this.particles.push({
                        x: this.fly.x, y: this.fly.y,
                        vx: randomRange(-10, 10), vy: randomRange(-10, 10),
                        life: 1.0,
                        color: Math.random() > 0.5 ? '#FFD700' : '#0056b3'
                    });
                }

                // Respawn
                this.fly.x = randomRange(100, this.width - 100);
                this.fly.y = randomRange(100, this.height - 100);
                this.changeFlyState(true);
            }

            updateFly(dt) {
                const fly = this.fly;
                fly.timer -= dt;

                // State Machine
                if (fly.timer <= 0) {
                    this.changeFlyState();
                }

                // Move
                if (fly.state === 'normal' || fly.state === 'dash') {
                    fly.x += fly.vx * (fly.state === 'dash' ? 3 : 1);
                    fly.y += fly.vy * (fly.state === 'dash' ? 3 : 1);
                } else if (fly.state === 'freeze') {
                    // Jitter
                    fly.x += randomRange(-2, 2);
                    fly.y += randomRange(-2, 2);
                }

                // Bounds (Strict Padding 60px)
                const pad = 60;
                if (fly.x < pad) { fly.x = pad; fly.vx = Math.abs(fly.vx); }
                if (fly.x > this.width - pad) { fly.x = this.width - pad; fly.vx = -Math.abs(fly.vx); }
                if (fly.y < pad) { fly.y = pad; fly.vy = Math.abs(fly.vy); }
                if (fly.y > this.height - pad) { fly.y = this.height - pad; fly.vy = -Math.abs(fly.vy); }

                fly.angle += dt * 10;
            }

            changeFlyState(forceNormal = false) {
                const fly = this.fly;
                if (forceNormal || fly.state === 'dash' || fly.state === 'freeze') {
                    // Go Normal
                    fly.state = 'normal';
                    fly.timer = randomRange(1, 3);
                    const angle = randomRange(0, Math.PI * 2);
                    const speed = randomRange(3, 6);
                    fly.vx = Math.cos(angle) * speed;
                    fly.vy = Math.sin(angle) * speed;
                } else {
                    // Random chance: Freeze or Dash?
                    if (Math.random() > 0.5) {
                        fly.state = 'freeze';
                        fly.timer = 0.5; // Short pause
                    } else {
                        fly.state = 'dash';
                        fly.timer = 0.8;
                        // Dash towards center if too close to edge
                        let targetAngle = randomRange(0, Math.PI * 2);
                        fly.vx = Math.cos(targetAngle) * 6;
                        fly.vy = Math.sin(targetAngle) * 6;
                    }
                }
            }

            updateParticles(dt) {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    let p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= dt * 2;
                    if (p.life <= 0) this.particles.splice(i, 1);
                }
            }

            draw(ctx) {
                // Clear & Shake
                ctx.save();
                let dx = randomRange(-this.shake, this.shake);
                let dy = randomRange(-this.shake, this.shake);
                ctx.translate(dx, dy);

                ctx.fillStyle = '#121212';
                ctx.fillRect(-dx, -dy, this.width, this.height);

                // Draw Fly
                Draw.glow(ctx, '#FFD700', 30);

                // Wings
                ctx.save();
                ctx.translate(this.fly.x, this.fly.y);
                const wingScale = Math.sin(this.fly.angle);
                ctx.fillStyle = '#0056b3';
                ctx.beginPath();
                ctx.ellipse(-20, 0, 30, 15 * Math.abs(wingScale) + 10, 0, 0, Math.PI * 2);
                ctx.ellipse(20, 0, 30, 15 * Math.abs(wingScale) + 10, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Body
                Draw.circle(ctx, this.fly.x, this.fly.y, this.fly.radius, '#FFD700');

                // Eyes
                Draw.resetGlow(ctx);
                ctx.fillStyle = '#000';
                Draw.circle(ctx, this.fly.x - 15, this.fly.y - 10, 8, '#000');
                Draw.circle(ctx, this.fly.x + 15, this.fly.y - 10, 8, '#000');

                // Draw Particles
                this.particles.forEach(p => {
                    ctx.globalAlpha = p.life;
                    Draw.circle(ctx, p.x, p.y, 5, p.color);
                    ctx.globalAlpha = 1;
                });

                ctx.restore();
            }
        }

        new FlyGame();
    </script>
</body>

</html>
