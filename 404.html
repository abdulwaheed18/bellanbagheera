    <style>
        .error-container {

        .error-code {

            font-size: 1.5rem;

        .cat-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }

        .btn-home {

        </div>
