<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BNB Ultimate Chase V4 🐾 | Bella Nawaab Bagheera</title>
    <meta name="description" content="Play The Ultimate Chase on Bella Nawaab Bagheera! Sandbox mode cat game where you select your prey and hunt.">
    <meta property="og:title" content="BNB Ultimate Chase V4 🐾 | Bella Nawaab Bagheera">
    <meta property="og:description" content="Play The Ultimate Chase on Bella Nawaab Bagheera! Sandbox mode cat game where you select your prey and hunt.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="images/profile_avatar.png">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #121212;
            user-select: none;
            font-family: sans-serif;
            -webkit-user-select: none;
            touch-action: none;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        #exit-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            z-index: 100;
        }

        /* Menu Overlay */
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #menu h1 {
            color: #FFD700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2rem;
            border-bottom: 2px solid #FFD700;
            padding-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 700px;
            width: 90%;
        }

        .prey-btn {
            background: #222;
            border: 2px solid #333;
            color: white;
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .prey-btn:active {
            transform: scale(0.95);
        }

        .prey-btn.selected {
            border-color: #FFD700;
            background: #333;
        }

        .prey-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            z-index: 2;
        }

        .prey-name {
            font-weight: bold;
            z-index: 2;
        }

        .hidden {
            display: none !important;
        }

        /* Swipe Lock UI */
        #lock-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            z-index: 1000;
            pointer-events: none;
            /* Let clicks pass through, except specific elements */
        }

        .lock-slot {
            position: absolute;
            width: 60px;
            height: 60px;
            top: 10px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            pointer-events: auto;
            transition: opacity 0.3s;
        }

        #lock-key {
            left: 20px;
            background-image: url('images/key_icon.png');
            cursor: grab;
        }

        #lock-target {
            right: 20px;
            background-image: url('images/lock_icon.png');
            opacity: 0.5;
        }

        .locked-mode #lock-key {
            cursor: default;
        }
        .back-to-shop {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.6);
            color: #D4AF37;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid #D4AF37;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .back-to-shop:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>
    <!-- Global Nav -->
    <header style="position: absolute; top: 0; left: 0; width: 100%; padding: 1rem; display: flex; justify-content: space-between; align-items: center; z-index: 2000; pointer-events: none; box-sizing: border-box;">
        <a href="index.html" style="font-size: 1.5rem; color: #fff; font-weight: bold; text-decoration: none; font-family: sans-serif; pointer-events: auto;">BNB</a>
        <div style="display: flex; gap: 1rem; align-items: center; pointer-events: auto;">
            <a href="index.html#product-grid" style="color: #000; background: #D4AF37; text-decoration: none; font-size: 0.9rem; text-transform: uppercase; font-family: sans-serif; font-weight: bold; padding: 0.5rem 1rem; border-radius: 4px;">Shop Now</a>
            <button style="background: none; border: none; color: white; cursor: pointer;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>
    </header>
    <a href="index.html" class="back-to-shop">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Shop
    </a>
    <div id="menu">
        <h1>Select Prey</h1>
        <div class="grid" id="prey-grid"></div>
    </div>

    <!-- Swipe Lock UI -->
    <div id="lock-container">
        <div id="lock-target" class="lock-slot"></div>
        <div id="lock-key" class="lock-slot"></div>
    </div>

    <div id="exit-zone"></div>
    <canvas id="gameCanvas"></canvas>

    <script src="js/exit-handler.js"></script>
    <script type="module">
        import { GameEngine, Draw, randomRange, UI, Patterns } from './game-utils.js';

        // --- Config ---
        const PREY_TYPES = {
            rat: { name: 'Mouse', icon: '🐭', env: 'cardboard', behavior: 'ground', speed: 10, sprite: 'mouse_sprite.png', frames: 4, width: 64, height: 64 },
            spider: { name: 'Spider', icon: '🕷️', env: 'cardboard', behavior: 'ground', speed: 8, sprite: 'cute_spider.png', frames: 4, width: 64, height: 64 },
            cockroach: { name: 'Roach', icon: '🪳', env: 'cardboard', behavior: 'ground', speed: 12, sprite: 'cute_cockroach.png', frames: 4, width: 64, height: 64 },
            bee: { name: 'Bee', icon: '🐝', env: 'sky', behavior: 'air', speed: 10 },
            butterfly: { name: 'Butterfly', icon: '🦋', env: 'sky', behavior: 'flutter', speed: 6 },
        };

        class ChaseGame extends GameEngine {
            constructor() {
                super('gameCanvas');

                this.preyList = [];
                this.particles = [];
                this.holes = []; // For ground logic
                this.bgPattern = null;
                this.config = null;
                this.loadedSprites = {};
                this.loadedAssets = {};

                this.isLocked = false;

                this.setupMenu();
                this.setupSwipeLock();
            }

            setupMenu() {
                const grid = document.getElementById('prey-grid');
                Object.keys(PREY_TYPES).forEach(key => {
                    const p = PREY_TYPES[key];
                    const btn = document.createElement('div');
                    btn.className = 'prey-btn';
                    btn.innerHTML = `<span class="prey-icon">${p.icon}</span><span class="prey-name">${p.name}</span>`;

                    // Mini preview bg
                    if (p.env === 'wood' || p.env === 'cardboard') btn.style.background = '#8d6e63';
                    if (p.env === 'sky') btn.style.background = '#87CEEB';
                    if (p.env === 'tile') btn.style.background = '#eee';
                    if (p.env === 'tile') btn.style.color = '#333';

                    btn.onclick = () => this.startGame(key);
                    grid.appendChild(btn);
                });
            }

            async startGame(typeKey) {
                document.getElementById('menu').classList.add('hidden');

                this.config = PREY_TYPES[typeKey];

                UI.showToast("Loading assets...");

                // Preload sprite
                if (this.config.sprite && !this.loadedSprites[typeKey]) {
                    await this.loadSprite(typeKey, this.config.sprite);
                }

                // Preload Env Assets
                if (this.config.env === 'cardboard') {
                    await this.loadAsset('cardboard_bg', 'images/cardboard_bg.png');
                    await this.loadAsset('hole_overlay', 'images/hole_overlay.png');
                }

                UI.showToast("Hunt Begins!");

                // Set Pattern
                if (this.config.env === 'cardboard') {
                    this.bgPattern = this.ctx.createPattern(this.loadedAssets['cardboard_bg'], 'repeat');
                }
                else if (this.config.env === 'wood') this.bgPattern = Patterns.createWood(this.width, this.height);
                else if (this.config.env === 'tile') this.bgPattern = Patterns.createTiles(this.width, this.height);
                else if (this.config.env === 'sky') this.bgPattern = Patterns.createSky(this.width, this.height);
                else this.bgPattern = Patterns.createDark(this.width, this.height);

                // Init Logic
                this.preyList = [];
                this.holes = [];

                if (this.config.behavior === 'ground') {
                    // Create Holes / Spawns
                    this.holes.push({ x: 100, y: 100 });
                    this.holes.push({ x: this.width - 100, y: this.height - 100 });
                    this.holes.push({ x: 100, y: this.height - 100 });
                    this.holes.push({ x: this.width - 100, y: 100 });
                    // Spawn one immediately
                    this.spawnGroundPrey();
                } else {
                    // Air/Float: Spawn center
                    this.spawnAirPrey(this.width / 2, this.height / 2);
                }

                this.start((dt) => this.update(dt), (ctx) => this.draw(ctx));
            }

            loadAsset(key, src) {
                return new Promise((resolve, reject) => {
                    if (this.loadedAssets[key]) return resolve();
                    const img = new Image();
                    img.onload = () => { this.loadedAssets[key] = img; resolve(); };
                    img.onerror = reject;
                    img.src = src;
                });
            }

            loadSprite(key, src) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => {
                        // Chroma Key Process
                        const c = document.createElement('canvas');
                        c.width = img.width;
                        c.height = img.height;
                        const ctx = c.getContext('2d');
                        ctx.drawImage(img, 0, 0);

                        const imgData = ctx.getImageData(0, 0, c.width, c.height);
                        const d = imgData.data;
                        const rBg = d[0], gBg = d[1], bBg = d[2]; // Sample top-left

                        for (let i = 0; i < d.length; i += 4) {
                            const r = d[i], g = d[i + 1], b = d[i + 2];
                            const dist = Math.sqrt((r - rBg) ** 2 + (g - gBg) ** 2 + (b - bBg) ** 2);
                            if (dist < 50) { // Tolerance
                                d[i + 3] = 0; // Transparent
                            }
                        }

                        ctx.putImageData(imgData, 0, 0);
                        const processedImg = new Image();
                        processedImg.onload = () => {
                            this.loadedSprites[key] = processedImg;
                            resolve();
                        };
                        processedImg.src = c.toDataURL();
                    };
                    img.onerror = reject;
                    img.src = `images/${src}`;
                });
            }

            setupSwipeLock() {
                const key = document.getElementById('lock-key');
                const target = document.getElementById('lock-target');
                let dragging = false;
                let startX = 0, startY = 0;
                let keyStartX = 20, keyStartY = 10;

                // Position helpers
                const setPos = (el, x, y) => {
                    el.style.left = x + 'px';
                    el.style.top = y + 'px';
                };

                // Initial Pos
                setPos(key, keyStartX, keyStartY);

                const onMove = (e) => {
                    if (!dragging) return;
                    e.preventDefault();

                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                    setPos(key, clientX - 30, clientY - 30); // Center grab
                };

                const onEnd = (e) => {
                    if (!dragging) return;
                    dragging = false;

                    const kRect = key.getBoundingClientRect();
                    const tRect = target.getBoundingClientRect();

                    // Check overlap
                    const overlap = !(kRect.right < tRect.left ||
                        kRect.left > tRect.right ||
                        kRect.bottom < tRect.top ||
                        kRect.top > tRect.bottom);

                    if (overlap) {
                        // Toggle Lock State
                        this.toggleLockState(!this.isLocked);
                    }

                    // Reset or Snap
                    if (this.isLocked) {
                        // Snap to Target (Right side)
                        setPos(key, window.innerWidth - 80, 10);
                    } else {
                        // Snap to Start (Left side)
                        setPos(key, 20, 10);
                    }
                };

                const onStart = (e) => {
                    dragging = true;
                    // Reset if needed
                };

                key.addEventListener('mousedown', onStart);
                key.addEventListener('touchstart', onStart, { passive: false });

                window.addEventListener('mousemove', onMove);
                window.addEventListener('touchmove', onMove, { passive: false });

                window.addEventListener('mouseup', onEnd);
                window.addEventListener('touchend', onEnd);

                // Handle resize snap
                window.addEventListener('resize', () => {
                    if (this.isLocked) setPos(key, window.innerWidth - 80, 10);
                });
            }

            toggleLockState(locked) {
                this.isLocked = locked;
                const menu = document.getElementById('menu');

                if (locked) {
                    UI.showToast("LOCKED 🔒");
                    document.body.classList.add('locked-mode');
                    // Request Fullscreen
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen().catch(() => { });
                    }
                    // Hide Menu if visible? No, usually lock happens during game
                } else {
                    UI.showToast("UNLOCKED 🔓");
                    document.body.classList.remove('locked-mode');
                    // Show Exit UI ?
                }
            }

            // --- Spawners ---
            spawnGroundPrey() {
                const startHole = this.holes[Math.floor(Math.random() * this.holes.length)];
                let endHole = this.holes[Math.floor(Math.random() * this.holes.length)];
                while (endHole === startHole) endHole = this.holes[Math.floor(Math.random() * this.holes.length)];

                // Add randomness to spawn point so they don't always come perfectly from center
                const sx = startHole.x + randomRange(-20, 20);
                const sy = startHole.y + randomRange(-20, 20);

                const angle = Math.atan2(endHole.y - sy, endHole.x - sx);

                this.preyList.push({
                    x: sx, y: sy,
                    target: endHole,
                    vx: Math.cos(angle) * this.config.speed,
                    vy: Math.sin(angle) * this.config.speed,
                    state: 'run',
                    angle: angle + Math.PI / 2, // Rotate to face direction (assuming sprite points UP)
                    life: 1, // for alpha
                    animTimer: 0
                });
            }

            spawnAirPrey(x, y) {
                this.preyList.push({
                    x: x, y: y,
                    vx: 0, vy: 0,
                    timer: randomRange(0, 10),
                    state: 'fly',
                    animTimer: 0
                });
            }

            // --- Logic ---
            update(dt) {
                // Input Hit Test
                if (this.input.justPressed) {
                    this.checkHit();
                }

                this.updatePrey(dt);
                this.updateParticles(dt);
            }

            updatePrey(dt) {
                for (let i = this.preyList.length - 1; i >= 0; i--) {
                    let p = this.preyList[i];
                    p.animTimer += dt;

                    if (this.config.behavior === 'ground') {
                        // Move to target
                        const dist = Math.hypot(p.target.x - p.x, p.target.y - p.y);
                        if (dist < 40) { // Reached hole
                            this.preyList.splice(i, 1);
                            setTimeout(() => this.spawnGroundPrey(), randomRange(500, 1500));
                        } else {
                            p.x += p.vx;
                            p.y += p.vy;
                            // Random jitter/curve
                            p.x += Math.sin(p.animTimer * 10) * 0.5;
                        }
                    }
                    else if (this.config.behavior === 'air' || this.config.behavior === 'flutter') {
                        p.timer += dt * 2;
                        p.x += Math.sin(p.timer) * 3;
                        p.y += Math.cos(p.timer * 0.7) * 2;

                        // Keep on screen
                        if (p.x < 50) p.x += 2;
                        if (p.x > this.width - 50) p.x -= 2;
                        if (p.y < 50) p.y += 2;
                        if (p.y > this.height - 50) p.y -= 2;
                    }
                }
            }

            checkHit() {
                let hit = false;
                this.preyList.forEach(p => {
                    const dist = Math.hypot(this.input.x - p.x, this.input.y - p.y);
                    if (dist < 100) { // Generous hit
                        hit = true;
                        this.audio.playPop();
                        this.spawnParticles(p.x, p.y, '#FFD700');

                        if (this.config.behavior === 'ground') {
                            // Scared! Run away fast!
                            p.vx *= -1.5;
                            p.vy *= -1.5;
                            p.angle += Math.PI;
                        } else {
                            p.x = randomRange(50, this.width - 50);
                            p.y = randomRange(50, this.height - 50);
                        }
                    }
                });

                if (hit) UI.showToast("Gotcha!");
            }

            spawnParticles(x, y, color = '#fff') {
                for (let i = 0; i < 8; i++) {
                    this.particles.push({ x, y, vx: randomRange(-5, 5), vy: randomRange(-5, 5), life: 1, color });
                }
            }

            updateParticles(dt) {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    let p = this.particles[i];
                    p.x += p.vx; p.y += p.vy;
                    p.life -= dt * 3;
                    if (p.life <= 0) this.particles.splice(i, 1);
                }
            }

            draw(ctx) {
                // Background
                if (this.bgPattern) {
                    ctx.fillStyle = this.bgPattern;
                    ctx.fillRect(0, 0, this.width, this.height);
                } else {
                    ctx.fillStyle = '#222';
                    ctx.fillRect(0, 0, this.width, this.height);
                }

                // Draw Holes (Cardboard Overlay)
                if (this.config.env === 'cardboard' && this.loadedAssets['hole_overlay']) {
                    const holeImg = this.loadedAssets['hole_overlay'];
                    this.holes.forEach(h => {
                        ctx.drawImage(holeImg, h.x - 60, h.y - 60, 120, 120);
                    });
                } else if (this.config.behavior === 'ground') {
                    this.holes.forEach(h => {
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.ellipse(h.x, h.y, 40, 20, 0, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }

                // Draw Prey
                this.preyList.forEach(p => {
                    ctx.save();
                    ctx.translate(p.x, p.y);

                    if (this.config.behavior === 'ground') {
                        ctx.rotate(p.angle);
                        // Soft Shadow
                        ctx.shadowColor = 'rgba(0,0,0,0.3)';
                        ctx.shadowBlur = 8;
                        ctx.shadowOffsetY = 5;
                    } else {
                        ctx.shadowColor = 'rgba(0,0,0,0.2)';
                        ctx.shadowBlur = 20;
                        ctx.shadowOffsetY = 40;
                    }

                    if (this.config.sprite && this.loadedSprites[Object.keys(PREY_TYPES).find(key => PREY_TYPES[key] === this.config)]) {
                        const img = this.loadedSprites[Object.keys(PREY_TYPES).find(key => PREY_TYPES[key] === this.config)];
                        const frameIndex = Math.floor(p.animTimer * 10) % this.config.frames;
                        const fw = img.width / this.config.frames;
                        const fh = img.height;
                        ctx.drawImage(img, frameIndex * fw, 0, fw, fh, -fw / 2, -fh / 2, fw, fh);
                    } else {
                        ctx.font = "60px sans-serif";
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(this.config.icon, 0, 0);
                    }

                    ctx.restore();
                });

                // Particles
                this.particles.forEach(p => {
                    ctx.globalAlpha = p.life;
                    Draw.circle(ctx, p.x, p.y, 5, p.color);
                    ctx.globalAlpha = 1;
                });
            }
        }

        new ChaseGame();
    </script>
</body>

</html>
